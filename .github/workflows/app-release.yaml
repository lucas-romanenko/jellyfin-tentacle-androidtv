name: App / Release

# APKs go to other people's TVs, so publishing is a release: only a version
# tag (vX.Y.Z) or a GitHub release publishes, never a push to master. A
# release made in the GitHub UI can fire both events for one tag; the
# concurrency group runs them in turn, and the second only re-attaches the
# same APK.
on:
  push:
    tags:
      - v*
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
      - name: Setup signing keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::Missing release signing secrets. A tagged release MUST be signed with the stable production keystore so Android allows in-place upgrades (otherwise users hit INSTALL_FAILED_UPDATE_INCOMPATIBLE). Configure the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEYSTORE_ALIAS, and KEYSTORE_KEY_PASSWORD repository secrets before tagging a release."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore
          echo "storeFile=${{ github.workspace }}/release.keystore" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEYSTORE_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> keystore.properties
      - name: Set version from tag
        run: echo "TENTACLE_VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
      - name: Assemble release APK
        run: ./gradlew assembleGithubRelease
      - name: Collect APKs
        run: mkdir -p build/release/; find app/build/ -iname "*.apk" -exec mv "{}" build/release/ \;
      # Lucas's own release (made in the UI) keeps its title and notes: the
      # APKs are only attached. A bare tag gets a release with generated notes.
      - name: Publish the APKs on the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" build/release/*.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/release/*.apk --verify-tag --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

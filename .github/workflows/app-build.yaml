name: App / Build

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
      - name: Assemble debug APKs
        run: ./gradlew assembleDebug
      # JVM unit tests of every module (the app's github flavour stands for both).
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :app:testGithubDebugUnitTest
      # The release build as the side-by-side "Tentacle Bench" app (app/build.gradle.kts):
      # start-up and scrolling are measured on it, and R8 problems show here first.
      - name: Assemble bench APK
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleGithubBench -Ptentacle.benchDebuggable=true
      # The build is the check. Its APKs are attached only to pull requests
      # (for reviewing them): on a public repo a push's artifacts are a
      # download anyone can take, and APKs reach users only by a release.
      - name: Create publish bundle
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p build/gh-app-publish/; find app/build/ -iname "*.apk" -exec mv "{}" build/gh-app-publish/ \;
          cp app/build/outputs/mapping/githubBench/mapping.txt build/gh-app-publish/bench-mapping.txt
      - name: Upload artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-artifacts
          retention-days: 14
          if-no-files-found: error
          path: build/gh-app-publish/

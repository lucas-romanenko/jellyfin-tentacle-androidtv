name: App / TV screenshots

# Screenshots of the Manage Episodes picker on an Android TV emulator (1080p), for reviewing
# how it looks. Not a required check: it runs only when the picker or its screenshot test changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - app/src/main/java/org/jellyfin/androidtv/ui/discover/EpisodePickerDialog.kt
      - app/src/androidTest/**
      - .github/workflows/app-tv-screenshots.yaml

permissions:
  contents: read

concurrency:
  group: tv-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Manage Episodes screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
      - name: Assemble app and test APKs
        run: |
          ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest
          ./gradlew --stop
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Installed and run by hand (not connectedAndroidTest, which uninstalls the app and
      # its files at the end) so the screenshots can be read from the app's files afterwards.
      - name: Run the screenshot test on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/tv-screenshots.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tv-screenshots
          retention-days: 14
          if-no-files-found: warn
          path: build/tv-screens/

# How agents may work on this repo: read by the maintainer's work tracker.
lane: server-public      # public repo; its APKs talk to the maintainer's Tentacle server
# read-only: the unit tests run only in CI (App / Build: testDebugUnitTest), never on the workbench
verify: gh run list -R lucas-romanenko/jellyfin-tentacle-androidtv -w app-build.yaml -c <sha> --json conclusion -q '.[].conclusion' | grep -qx success
merge: approved          # agents merge a pull request only after the maintainer approves it, at that head
deploy: false            # the maintainer tests on the TV and releases
needs_lucas_labels: [needs-lucas, security]
